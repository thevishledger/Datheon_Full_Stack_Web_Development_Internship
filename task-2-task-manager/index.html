<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager — Vishesh Srivastava</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app">
    <header class="app-header">
      <h1>📝 My Task Manager</h1>
      <p class="subtitle">Add, edit and track your tasks. Everything is saved in your browser (localStorage) — no server needed.</p>
    </header>

    <!-- ============ ADD / EDIT FORM ============ -->
    <!-- The same form is reused for editing: script.js fills it and changes the button text -->
    <form id="taskForm" class="task-form">
      <div class="form-row">
        <input type="text" id="taskTitle" placeholder="What needs to be done?" maxlength="120" aria-label="Task title" />
      </div>
      <div class="form-row form-row-split">
        <select id="taskCategory" aria-label="Category">
          <option value="Work">💼 Work</option>
          <option value="Personal">🏠 Personal</option>
          <option value="Study">📚 Study</option>
        </select>
        <input type="date" id="taskDueDate" aria-label="Due date" />
      </div>
      <p id="formError" class="form-error" hidden></p>
      <div class="form-row form-actions">
        <button type="submit" id="submitBtn" class="btn btn-primary">Add Task</button>
        <button type="button" id="cancelEditBtn" class="btn btn-ghost" hidden>Cancel Edit</button>
      </div>
    </form>

    <!-- ============ FILTERS ============ -->
    <div class="filters">
      <div class="filter-group" role="group" aria-label="Status filter">
        <button type="button" class="filter-btn active" data-status="All">All</button>
        <button type="button" class="filter-btn" data-status="Active">Active</button>
        <button type="button" class="filter-btn" data-status="Completed">Completed</button>
      </div>
      <select id="categoryFilter" aria-label="Category filter">
        <option value="All">All Categories</option>
        <option value="Work">💼 Work</option>
        <option value="Personal">🏠 Personal</option>
        <option value="Study">📚 Study</option>
      </select>
    </div>

    <p id="taskCount" class="task-count"></p>

    <!-- ============ TASK LIST ============ -->
    <ul id="taskList" class="task-list"></ul>

    <!-- Empty state: shown when there is nothing to display -->
    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-emoji">🎉</div>
      <p id="emptyText">No tasks here yet. Add your first task above!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
